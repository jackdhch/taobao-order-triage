<rect x="733.6" y="40" width="195.2" height="150" rx="14" fill="#FFFFFF" stroke="#DCE1DC" stroke-width="1.5"/>
<text x="831.2" y="90" text-anchor="middle" font-size="22" font-weight="700" fill="#1D2629">自动依次完成</text>
