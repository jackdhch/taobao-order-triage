<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>模拟订单页（测试抓取脚本用）</title>

     无参数：旧版页面（给抓取脚本「按文字特征猜」的回退解析用）
     ?v=new：新版页面（2026-09 真实页面的 DOM 结构；tools/e2e-mock.py 用它做离线回归测试） -->
<style>
body{font:14px system-ui,"Microsoft YaHei";background:#fff;margin:20px}
.od{border:1px solid #eee;margin-bottom:14px}
.hd{background:#f5f5f5;padding:10px 14px;display:flex;gap:18px;align-items:center}
.hd .st{margin-left:auto;color:#f50}
.hd img{width:16px;height:16px}
.it{display:flex;gap:16px;padding:14px}
.it img.p{width:90px;height:90px;display:block;background:#ddd}
.c1{flex:1}.c2{width:90px;text-align:right}.c3{width:130px;text-align:right}.c4{width:110px}
.pager{display:flex;gap:10px}
.pager .disabled{color:#aaa;pointer-events:none}
/* 新版：class 用真实页面的前缀，后缀是假哈希，只按前缀写选择器 */
[class*="shopInfo--"]{display:flex;background:#f5f5f5;padding:8px 12px}
[class*="shopInfoLeft--"]{display:flex;gap:14px;align-items:center;flex:1}
[class*="shopInfoRight--"]{display:flex;gap:10px;color:#f50}
.type-of-row{display:flex}
.type-of-row>.trade-container:first-child{flex:1}
[class*="itemInfo--"]{display:flex;gap:12px;padding:10px 12px}
[class*="itemInfoColItem--"]{display:flex;gap:12px;flex:1}
[class*="image--"]{display:block;width:80px;height:80px;background:#ddd center/cover}
[class*="iconSearch--"]{display:block;width:0;height:0}
[class*="itemInfoColPrice--"]{width:100px;text-align:right}
[class*="payment--"],[class*="operations--"]{width:130px;padding:10px;text-align:right}
.trade-price-strike{text-decoration:line-through;color:#999}
.trade-button{display:inline-block;border:1px solid #ccc;border-radius:12px;padding:2px 10px;margin:2px;cursor:pointer;font-size:12px}
.trade-button-disabled{color:#bbb;cursor:not-allowed}
[class*="extItems--"],[class*="guessRow--"]{display:flex;gap:8px;padding:8px 12px;flex-wrap:wrap}
[class*="itemImage--"],[class*="guessImage--"]{width:90px;height:90px;background:#eee center/cover}
[class*="guessCard--"]{height:200px}
.mock-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
[id^="shopOrderContainer_"]{border:1px solid #eee;margin-bottom:14px}
</style>
</head>

let page = 0;
function render(){
  document.getElementById('list').innerHTML = PAGES[page].map(o => `
   <div class="od">
    <div class="hd"><span>${o.d}</span><span>订单号: ${o.no}</span>
      <img src="https://img.alicdn.com/mock/badge.png" alt=""><a href="https://store.taobao.com/shop/view_shop.htm?mock=1">${o.shop}</a>
      <img src="https://img.alicdn.com/mock/ww.png" alt=""><a href="#">订单详情 ></a><span class="st">${o.st}</span></div>
    ${o.items.map((it,i) => `
    <div class="it">
      <img class="p" src="https://img.alicdn.com/mock/item-${o.no}-${i}.jpg" alt="">
      <div class="c1"><a href="https://item.taobao.com/item.htm?id=${o.no.slice(-6)}${i}">${it.t} [交易快照]</a>
        <div>${it.sku}</div><div>退货宝 7天价保</div><div><button>加入购物车</button> <button>申请售后</button></div>
        ${it.refund ? `<div><a href="#">${it.refund}</a></div>` : ''}</div>

      ${i === 0 ? `<div class="c3">实付款 ¥${o.pay}<div>含运费: ¥${o.ship}</div></div>` : '<div class="c3"></div>'}
      <div class="c4"><button>再买一单</button><div>查看物流</div></div>
    </div>`).join('')}
   </div>`).join('');
  document.getElementById('next').className = page >= PAGES.length - 1 ? 'disabled' : '';
}
document.getElementById('next').onclick = () => { if (page < PAGES.length - 1) { page++; setTimeout(render, 400); } };
document.getElementById('prev').onclick = () => { if (page > 0) { page--; render(); } };
render();
}
</script>

      + (o.credit ? '<div>该订单使用信用卡支付</div>' : '') + '</div></div>'
      + '<div class="trade-container type-of-normal"><div class="' + h('operations') + '">'
      + (o.st === '卖家已发货' ? btn('确认收货') + btn('延长收货') : '') + btn('再买一单') + btn('查看物流') + btn('申请开票') + '</div></div>'
      + '</div>'
      + '<div class="' + h('extBlank') + '"><div class="' + h('extItems') + '"><div>常买常逛 推荐常看商品</div>' + cards('item', 10, k * 10) + '</div></div>'
      + '</div>';
  }

  document.body.innerHTML = '<div class="mock-top"><span class="ant-input-affix-wrapper"><input placeholder="商品标题/订单号/店铺名/快递单号" class="ant-input"></span>'
    + '<div id="pager"></div></div><div id="orders"></div>'
    + '<div class="' + h('guessYouLike') + '"><div>猜你喜欢</div></div>';
  const $list = document.getElementById('orders'), $pager = document.getElementById('pager'), $feed = document.body.lastElementChild;
  let mode = 'default', page = 0, partial = true;
  function render() {
    const pages = LISTS[mode], list = pages[page];
    $list.innerHTML = (partial ? list.slice(0, 2) : list).map((o, i) => box(o, page * 10 + i)).join('');
    const off = (on, cls) => 'trade-button trade-button-type-text' + (on ? '' : ' trade-button-disabled') + cls;
    // 「‹ 上一页」「下一页 ›」：文字直接在 div 里，箭头是子 span 里的 svg（所以抓取脚本找翻页按钮时候选元素要包括 div）
    const arrow = d => '<span class="trade-button-icon"><svg width="8" height="8" viewBox="0 0 8 8"><path d="' + d + '"/></svg></span>';
    $pager.innerHTML = '<div class="' + off(page > 0, ' mock-prev') + '">' + arrow('M6 0L2 4l4 4') + '上一页</div>'
      + '<div class="' + off(page < pages.length - 1, ' mock-next') + '">下一页' + arrow('M2 0l4 4-4 4') + '</div>';
  }
  const show = (m, p) => { mode = m; page = p; render(); window.__mock.log.push(m + ':' + (p + 1)); };
  // 不能点的按钮点了也没反应（和真实页面一样）；能点的等 0.5 秒（假装请求服务器）再换页
  $pager.addEventListener('click', e => {
    const b = e.target.closest('.trade-button');
    if (!b || /trade-button-disabled/.test(b.className)) return;
    const p = page + (b.classList.contains('mock-next') ? 1 : -1);
    setTimeout(() => { show(mode, p); window.scrollTo(0, 0); }, 500);
  });
  // 搜索框什么都不填按回车 → 搜索列表第 1 页
  document.querySelector('input.ant-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.target.value.trim()) setTimeout(() => show('search', 0), 800);
  });
  let loading = false, feedN = 0;
  window.addEventListener('scroll', () => {
    if (partial && window.scrollY > 0) { partial = false; setTimeout(render, 200); }     // 往下滚才出齐
    if (!loading && window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 300) {
      loading = true;
      setTimeout(() => { const r = document.createElement('div'); r.className = h('guessRow'); r.innerHTML = cards('guess', 10, 500 + 10 * feedN++); $feed.appendChild(r); loading = false; }, 500);
    }
  });
  show('default', 0);
})();
</script>
</body>
</html>
